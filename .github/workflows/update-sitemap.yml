name: Update sitemap and article slug index

on:
  push:
    branches: [main]
    paths:
      - 'posts/**/*.md'
      - 'posts/*.md'
      - '.pages.yml'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build article slug index and sitemap
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json
          import re
          import xml.etree.ElementTree as ET

          base = "https://marjan.in/"
          static_pages = [
              "", "about.html", "parenting.html", "kids-education.html",
              "activities.html", "reading-habit.html", "mobile-habit.html"
          ]
          urls = [base + page for page in static_pages]
          posts_dir = Path("posts")
          slug_index = {}

          if posts_dir.exists():
              for post in sorted(posts_dir.glob("*.md")):
                  content = post.read_text(encoding="utf-8")
                  match = re.search(r"^slug:\s*[\"']?([a-zA-Z0-9-]+)[\"']?\s*$", content, re.MULTILINE)
                  slug = match.group(1) if match else post.stem
                  if not re.fullmatch(r"[a-zA-Z0-9-]+", slug):
                      raise ValueError(f"Invalid article slug in {post.name}: {slug}")
                  if slug in slug_index:
                      raise ValueError(f"Duplicate article slug: {slug}")
                  slug_index[slug] = post.name
                  urls.append(base + "articles/" + quote(slug, safe="-") + "/")

          Path("posts/index.json").write_text(
              json.dumps(slug_index, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # Generate complete static article pages. The clean URLs must not
          # depend on browser-side JavaScript or a GitHub API request to show text.
          import html
          import re

          def parse_post(content):
              match = re.match(r"^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$", content)
              if not match:
                  return {}, content
              meta = {}
              current = None
              for line in match.group(1).splitlines():
                  item = re.match(r"^([a-zA-Z_]+):\s*(.*)$", line)
                  if item:
                      current = item.group(1)
                      meta[current] = item.group(2).strip().strip('"\'')
                  elif current and re.match(r"^\s{2,}\S", line):
                      meta[current] += " " + line.strip()
              return meta, match.group(2).strip()

          def inline(text):
              value = html.escape(text, quote=False)
              value = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", value)
              value = re.sub(r"\*(.+?)\*", r"<em>\1</em>", value)
              return value

          def render_markdown(body, title):
              lines = body.replace("\r", "").splitlines()
              blocks, paragraph = [], []
              def flush():
                  if paragraph:
                      blocks.append("<p>" + " ".join(inline(x) for x in paragraph) + "</p>")
                      paragraph.clear()
              i = 0
              while i < len(lines):
                  line = lines[i].strip()
                  if not line:
                      flush()
                      i += 1
                      continue
                  if not blocks and line.lstrip("# ").strip() == title.strip():
                      i += 1
                      continue
                  heading = re.match(r"^(#{1,3})\s+(.+)$", line)
                  if heading:
                      flush()
                      level = len(heading.group(1))
                      blocks.append(f"<h{level}>{inline(heading.group(2))}</h{level}>")
                      i += 1
                      continue
                  if re.match(r"^\d+[.)]\s+\S+", line):
                      flush()
                      blocks.append("<h2>" + inline(line) + "</h2>")
                      i += 1
                      continue
                  if line.startswith(("- ", "* ")):
                      flush()
                      items = []
                      while i < len(lines) and lines[i].strip().startswith(("- ", "* ")):
                          items.append("<li>" + inline(lines[i].strip()[2:]) + "</li>")
                          i += 1
                      blocks.append("<ul>" + "".join(items) + "</ul>")
                      continue
                  paragraph.append(line)
                  i += 1
              flush()
              return "\n".join(blocks)

          template = Path("article.html").read_text(encoding="utf-8")
          # Clean article routes are fully rendered HTML: no JS redirect or
          # client-side replacement can make the article text disappear.
          template = re.sub(r"<script>[\s\S]*?</script>", "", template, flags=re.I)
          template = template.replace('href="index.html"', 'href="/index.html"')

          for post in sorted(posts_dir.glob("*.md")) if posts_dir.exists() else []:
              raw = post.read_text(encoding="utf-8")
              meta, body = parse_post(raw)
              slug = str(meta.get("slug") or post.stem).strip()
              if not re.fullmatch(r"[a-zA-Z0-9-]+", slug):
                  continue
              title = str(meta.get("title") or slug)
              category = str(meta.get("category") or "MARJAN.IN")
              date = str(meta.get("date") or "")
              image_path = str(meta.get("image") or "").strip()
              image_html = (
                  '<img id="articleImage" src="' + html.escape(image_path, quote=True) +
                  '" alt="' + html.escape(str(meta.get("image_alt") or title), quote=True) + '">'
                  if image_path else ""
              )
              description = str(meta.get("seo_description") or meta.get("excerpt") or "MARJAN.IN पर बच्चों की परवरिश और शिक्षा से जुड़ी उपयोगी जानकारी।")
              canonical = base + "articles/" + quote(slug, safe="-") + "/"
              page = template
              page = page.replace('<link rel="canonical" href="https://marjan.in/article.html">', '<link rel="canonical" href="' + html.escape(canonical, quote=True) + '">')
              page = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="' + html.escape(description, quote=True) + '">', page, count=1)
              page = re.sub(r"<title>[\s\S]*?</title>", "<title>" + html.escape(str(meta.get("seo_title") or title)) + "</title>", page, count=1)
              page = re.sub(r'<h1 id="articleTitle">[\s\S]*?</h1>', '<h1 id="articleTitle">' + html.escape(title) + '</h1>', page, count=1)
              page = re.sub(r'<p class="meta" id="articleMeta">[\s\S]*?</p>', '<p class="meta" id="articleMeta">' + html.escape(" • ".join(x for x in [category, date] if x)) + '</p>', page, count=1)
              page = re.sub(r'<img id="articleImage"[\s\S]*?>', image_html, page, count=1)
              page = re.sub(r'<div id="articleBody">[\s\S]*?</div>', '<div id="articleBody">' + render_markdown(body, title) + '</div>', page, count=1)
              route_file = Path("articles") / slug / "index.html"
              route_file.parent.mkdir(parents=True, exist_ok=True)
              route_file.write_text(page, encoding="utf-8")

          ET.register_namespace("", "http://www.sitemaps.org/schemas/sitemap/0.9")
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          root = ET.Element(ns + "urlset")
          for url in dict.fromkeys(urls):
              entry = ET.SubElement(root, ns + "url")
              ET.SubElement(entry, ns + "loc").text = url
          ET.indent(root, space="  ")
          Path("sitemap.xml").write_bytes(
              b'<?xml version="1.0" encoding="UTF-8"?>\n' +
              ET.tostring(root, encoding="utf-8")
          )
          PY
      - name: Commit updated slug index and sitemap
        run: |
          if [ -z "$(git status --porcelain -- sitemap.xml posts/index.json articles)" ]; then
            echo "Sitemap, article slug index, and static article pages are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml posts/index.json articles/
          git commit -m "Update clean article URLs and sitemap"
          git push
