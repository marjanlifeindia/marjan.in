name: Update sitemap and article slug index

on:
  push:
    branches: [main]
    paths:
      - 'posts/**/*.md'
      - 'posts/*.md'
      - '.pages.yml'
      - 'article.html'
      - '.github/workflows/update-sitemap.yml'
  pull_request:
    paths:
      - 'posts/**/*.md'
      - 'posts/*.md'
      - '.pages.yml'
      - 'article.html'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build article slug index and sitemap
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json
          import re
          import xml.etree.ElementTree as ET

          base = "https://marjan.in/"
          # List only preferred, non-redirecting public URLs in the sitemap.
          static_pages = [
              "", "about", "parenting", "kids-education",
              "activities", "mobile-habit", "kids-corner", "baby-names/",
              "baby-names/a-letter-hindu-boy-names/",
              "privacy-policy", "contact", "terms", "affiliate-disclosure"
          ]
          urls = [base + page for page in static_pages]
          posts_dir = Path("posts")
          slug_index = {}

          if posts_dir.exists():
              for post in sorted(posts_dir.glob("*.md")):
                  content = post.read_text(encoding="utf-8")
                  match = re.search(r"^slug:\s*[\"']?([a-zA-Z0-9-]+)[\"']?\s*$", content, re.MULTILINE)
                  slug = match.group(1) if match else post.stem
                  if not re.fullmatch(r"[a-zA-Z0-9-]+", slug):
                      raise ValueError(f"Invalid article slug in {post.name}: {slug}")
                  if slug in slug_index:
                      raise ValueError(f"Duplicate article slug: {slug}")
                  slug_index[slug] = post.name
                  urls.append(base + "article-" + quote(slug, safe="-"))

          Path("posts/index.json").write_text(
              json.dumps(slug_index, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # Generate complete static article pages. The clean URLs must not
          # depend on browser-side JavaScript or a GitHub API request to show text.
          import html
          import re

          def parse_post(content):
              match = re.match(r"^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$", content)
              if not match:
                  return {}, content
              meta = {}
              current = None
              for line in match.group(1).splitlines():
                  item = re.match(r"^([a-zA-Z_]+):\s*(.*)$", line)
                  if item:
                      current = item.group(1)
                      meta[current] = item.group(2).strip().strip('"\'')
                  elif current and re.match(r"^\s{2,}\S", line):
                      meta[current] += " " + line.strip()
              return meta, match.group(2).strip()

          def inline(text):
              # Escape source HTML; restore only supported, sanitized Markdown links.
              links = {}
              def keep_link(match):
                  label, url = match.group(1), match.group(2)
                  if not url.startswith(("/", "#", "https://", "http://", "mailto:")):
                      return match.group(0)
                  key = "MARJANLINK" + str(len(links)) + "TOKEN"
                  links[key] = '<a href="' + html.escape(url, quote=True) + '">' + html.escape(label) + '</a>'
                  return key
              text = re.sub(r"\[([^\]]+)\]\(([^)\s]+)\)", keep_link, text)
              value = html.escape(text, quote=False)
              value = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", value)
              value = re.sub(r"(?<!\*)\*([^*]+)\*(?!\*)", r"<em>\1</em>", value)
              value = re.sub(r"~~(.+?)~~", r"<del>\1</del>", value)
              for key, link in links.items():
                  value = value.replace(key, link)
              return value

          def render_markdown(body, title):
              lines = body.replace("\r", "").splitlines()
              blocks, paragraph = [], []
              def flush():
                  if paragraph:
                      blocks.append("<p>" + " ".join(inline(x) for x in paragraph) + "</p>")
                      paragraph.clear()
              i = 0
              while i < len(lines):
                  line = lines[i].strip()
                  if not line:
                      flush()
                      i += 1
                      continue
                  if not blocks and line.lstrip("# ").strip() == title.strip():
                      i += 1
                      continue
                  heading = re.match(r"^(#{1,3})\s+(.+)$", line)
                  if heading:
                      flush()
                      level = len(heading.group(1))
                      blocks.append("<h" + str(level) + ">" + inline(heading.group(2)) + "</h" + str(level) + ">")
                      i += 1
                      continue
                  if re.match(r"^\\d+[.)]\\s+\\S+", line):
                      flush()
                      items = []
                      first_number = int(re.match(r"^(\\d+)", line).group(1))
                      while i < len(lines) and re.match(r"^\\s*\\d+[.)]\\s+\\S+", lines[i]):
                          item_match = re.match(r"^\\s*(\\d+)[.)]\\s+(\\S.*)$", lines[i])
                          items.append((int(item_match.group(1)), item_match.group(2).strip()))
                          i += 1
                      if len(items) == 1:
                          number, item = items[0]
                          blocks.append("<h2>" + str(number) + ". " + inline(item) + "</h2>")
                      else:
                          list_items = "".join("<li>" + inline(item) + "</li>" for _, item in items)
                          start_attr = ' start="' + str(first_number) + '"' if first_number != 1 else ""
                          blocks.append("<ol" + start_attr + ">" + list_items + "</ol>")
                      continue
                  if line.startswith(("- ", "* ")):
                      flush()
                      items = []
                      while i < len(lines) and lines[i].strip().startswith(("- ", "* ")):
                          items.append("<li>" + inline(lines[i].strip()[2:]) + "</li>")
                          i += 1
                      blocks.append("<ul>" + "".join(items) + "</ul>")
                      continue
                  if line.startswith(">"):
                      flush()
                      quote_lines = []
                      while i < len(lines) and lines[i].strip().startswith(">"):
                          quote_lines.append(inline(lines[i].strip()[1:].lstrip()))
                          i += 1
                      blocks.append("<blockquote><p>" + " ".join(quote_lines) + "</p></blockquote>")
                      continue
                  if re.fullmatch(r"([-*_])\1{2,}", line):
                      flush()
                      blocks.append("<hr>")
                      i += 1
                      continue
                  paragraph.append(line)
                  i += 1
              flush()
              return "\n".join(blocks)

          template = Path("article.html").read_text(encoding="utf-8")
          # Clean article routes are fully rendered HTML: no JS redirect or
          # client-side replacement can make the article text disappear.
          template = re.sub(r"<script>[\s\S]*?</script>", "", template, flags=re.I)
          template = template.replace('href="index.html"', 'href="/index.html"')

          for post in sorted(posts_dir.glob("*.md")) if posts_dir.exists() else []:
              raw = post.read_text(encoding="utf-8")
              meta, body = parse_post(raw)
              slug = str(meta.get("slug") or post.stem).strip()
              if not re.fullmatch(r"[a-zA-Z0-9-]+", slug):
                  continue
              title = str(meta.get("title") or slug)
              category = str(meta.get("category") or "MARJAN.IN")
              date = str(meta.get("date") or "")
              image_path = str(meta.get("image") or "").strip()
              image_html = (
                  '<img id="articleImage" src="' + html.escape(image_path, quote=True) +
                  '" alt="' + html.escape(str(meta.get("image_alt") or title), quote=True) + '">'
                  if image_path else ""
              )
              description = str(meta.get("seo_description") or meta.get("excerpt") or "MARJAN.IN पर बच्चों की परवरिश और शिक्षा से जुड़ी उपयोगी जानकारी।")
              canonical = base + "article-" + quote(slug, safe="-")
              page = template
              page = page.replace('<link rel="canonical" href="https://marjan.in/article.html">', '<link rel="canonical" href="' + html.escape(canonical, quote=True) + '">')
              page = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="' + html.escape(description, quote=True) + '">', page, count=1)
              page = re.sub(r"<title>[\s\S]*?</title>", "<title>" + html.escape(str(meta.get("seo_title") or title)) + "</title>", page, count=1)
              page = re.sub(r'<h1 id="articleTitle">[\s\S]*?</h1>', '<h1 id="articleTitle">' + html.escape(title) + '</h1>', page, count=1)
              page = re.sub(r'<p class="meta" id="articleMeta">[\s\S]*?</p>', '<p class="meta" id="articleMeta">' + html.escape(" • ".join(x for x in [category, date] if x)) + '</p>', page, count=1)
              page = re.sub(r'<img id="articleImage"[\s\S]*?>', image_html, page, count=1)
              page = re.sub(r'<div id="articleBody">[\s\S]*?</div>', '<div id="articleBody">' + render_markdown(body, title) + '</div>', page, count=1)
              route_file = Path("articles") / slug / "index.html"
              route_file.parent.mkdir(parents=True, exist_ok=True)
              route_file.write_text(page, encoding="utf-8")
              top_level_file = Path("article-" + slug + ".html")
              top_level_file.write_text(page, encoding="utf-8")

          ET.register_namespace("", "http://www.sitemaps.org/schemas/sitemap/0.9")
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          root = ET.Element(ns + "urlset")
          for url in dict.fromkeys(urls):
              entry = ET.SubElement(root, ns + "url")
              ET.SubElement(entry, ns + "loc").text = url
          ET.indent(root, space="  ")
          Path("sitemap.xml").write_bytes(
              b'<?xml version="1.0" encoding="UTF-8"?>\n' +
              ET.tostring(root, encoding="utf-8")
          )
          PY
      - name: Validate generated articles and sitemap
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          index = json.loads(Path("posts/index.json").read_text(encoding="utf-8"))
          sitemap = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = {node.text for node in sitemap.findall(".//sm:loc", ns)}
          for slug in index:
              if not re.fullmatch(r"[A-Za-z0-9-]+", slug):
                  raise SystemExit("Invalid slug: " + slug)
              page = Path("article-" + slug + ".html")
              if not page.exists():
                  raise SystemExit("Missing generated page: " + str(page))
              html = page.read_text(encoding="utf-8")
              checks = {
                  "canonical": '<link rel="canonical" href="https://marjan.in/article-' + slug + '">' in html,
                  "single H1": len(re.findall(r"<h1\b", html, re.I)) == 1,
                  "article body": bool(re.search(r'<div id="articleBody">.+?</div>', html, re.S)),
                  "description": bool(re.search(r'<meta name="description" content="[^"]+">', html)),
                  "sitemap URL": "https://marjan.in/article-" + slug in urls,
              }
              failed = [name for name, ok in checks.items() if not ok]
              if failed:
                  raise SystemExit(slug + ": failed checks: " + ", ".join(failed))
          print("Validated " + str(len(index)) + " generated articles and sitemap entries.")
          PY
      - name: Upload generated article preview files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marjan-article-preview
          path: |
            sitemap.xml
            posts/index.json
            articles/
            article-*.html
          if-no-files-found: error
          retention-days: 7
      - name: Commit updated slug index and sitemap
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Validation-only event; generated files are not committed."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- sitemap.xml posts/index.json articles article-*.html)" ]; then
            echo "Sitemap, article slug index, and static article pages are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml posts/index.json articles/ article-*.html
          git commit -m "Update clean article URLs and sitemap"
          git push
