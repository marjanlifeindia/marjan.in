media:
  input: media
  output: /media

content:
  - name: posts
    label: नए लेख (Articles)
    type: collection
    path: posts
    format: yaml-frontmatter
    fields:
      - name: title
        label: लेख का शीर्षक
        type: string
        required: true

      - name: slug
        label: SEO URL Slug (English letters, numbers, hyphens)
        type: string
        required: true

      - name: date
        label: प्रकाशित करने की तारीख
        type: date

      - name: category
        label: श्रेणी (Category)
        type: select
        required: true
        options:
          values:
            - Parenting
            - Kids Education
            - Kids Activities
            - Toys & Learning
            - Kids Books
            - School Supplies

      - name: excerpt
        label: लेख का छोटा परिचय
        type: text

      - name: image
        label: मुख्य फोटो
        type: image

      - name: seo_title
        label: SEO Title
        type: string

      - name: seo_description
        label: SEO Description
        type: text

      - name: body
        label: लेख की सामग्री
        type: rich-text
