media:
  input: media
  output: /media

content:
  - name: posts
    label: नए लेख (Articles)
    type: collection
    path: posts
    filename: "{slug}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: टाइटल (Title)
        type: string
        required: true
      - name: slug
        label: SEO URL Slug (English letters, numbers, hyphens)
        type: string
        required: true
      - name: date
        label: तारीख (Date)
        type: date
      - name: category
        label: कैटेगरी (Category)
        type: select
        required: true
        options:
          values:
            - Parenting
            - Kids Education
            - Kids Activities
            - Kids Corner
            - Toys & Learning
            - Kids Books
            - School Supplies
      - name: excerpt
        label: संक्षिप्त विवरण (Excerpt)
        type: text
      - name: image
        label: मुख्य तस्वीर का URL (Image)
        type: string
      - name: image_alt
        label: तस्वीर का वर्णन (Image Alt Text)
        type: string
      - name: seo_title
        label: SEO Title
        type: string
      - name: seo_description
        label: SEO Description
        type: text
      - name: body
        label: कंटेंट (Content)
        type: rich-text

  - name: baby-names
    label: बेबी नेम्स (Baby Names)
    type: collection
    path: baby-names
    format: yaml-frontmatter
    fields:
      - name: title
        label: टाइटल (Title)
        type: string
        required: true
      - name: body
        label: कंटेंट (Content)
        type: rich-text
