media:
  input: media
  output: /media

content:
  - name: posts
    label: नए लेख (Articles)
    type: collection
    path: posts
    filename: "{slug}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: टाइटल (Title)
        type: string
        required: true
      - name: slug
        label: SEO URL Slug (English letters, numbers, hyphens)
        type: string
        required: true
      - name: date
        label: तारीख (Date)
        type: date
      - name: category
        label: कैटेगरी (Category)
        type: select
        required: true
        options:
          values:
            - Parenting
            - Kids Education
            - Kids Activities
            - Kids Corner
      - name: body
        label: कंटेंट (Content)
        type: rich-text

  - name: baby-names
    label: बेबी नेम्स (Baby Names)
    type: collection
    path: baby-names
    format: yaml-frontmatter
    fields:
      - name: title
        label: टाइटल (Title)
        type: string
        required: true
      - name: body
        label: कंटेंट (Content)
        type: rich-text
