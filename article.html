<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MARJAN.IN पर बच्चों की परवरिश, शिक्षा और सीखने से जुड़े उपयोगी लेख।">
<title>लेख | MARJAN.IN</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fffaf8;color:#303747;line-height:1.8}
header{background:#243047;color:white;padding:16px 5%}
header a{color:white;text-decoration:none;font-size:26px;font-weight:bold}
main{max-width:1000px;margin:auto;padding:24px 5%}
.article{background:white;padding:clamp(18px,4vw,40px);border:1px solid #eee5e2;border-radius:14px}
h1,h2,h3{color:#243047;line-height:1.4}
h1{font-size:clamp(26px,3.2vw,36px);margin-top:8px}
h2{font-size:clamp(21px,2.4vw,27px);margin:28px 0 10px}
#articleImage{display:block;width:auto;max-width:100%;height:auto;max-height:560px;object-fit:contain;object-position:center;margin:20px auto 28px;border-radius:10px}
#articleBody{font-size:17px;overflow-wrap:anywhere}
#articleBody p{margin:0 0 18px}
#articleBody li{margin-bottom:8px}
.meta{color:#687080;font-size:14px}
.back{display:inline-block;margin:18px 0;color:#2464a5;font-weight:bold}
footer{text-align:center;background:#243047;color:white;padding:20px}
@media(min-width:768px){main{padding-top:34px;padding-bottom:40px}.article{padding:40px 52px}#articleBody{font-size:18px}}
@media(max-width:480px){main{padding:16px 4%}.article{padding:18px}#articleImage{max-height:420px}}
</style>
</head>
<body>
<header><a href="index.html">marjan.in</a><p>Parenting • Education • Learning</p></header>
<main><a class="back" href="index.html">← Homepage पर वापस जाएँ</a><article class="article"><p id="status">लेख लोड हो रहा है…</p><h1 id="articleTitle"></h1><p class="meta" id="articleMeta"></p><img id="articleImage" alt="" hidden><div id="articleBody"></div></article></main>
<footer>© 2026 MARJAN.IN. All rights reserved.</footer>
<script>
function escapeHtml(value){return String(value||"").replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;',"'":"&#39;"}[ch];});}
function parseFrontMatter(markdown){
 const match=markdown.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
 if(!match)return null;const meta={};let key="";
 match[1].split("\n").forEach(function(line){const item=line.match(/^([a-zA-Z_]+):\s*(.*)$/);if(item){key=item[1];meta[key]=item[2].trim().replace(/^["']|["']$/g,"");}else if(key&&/^\s{2,}\S/.test(line)){meta[key]+=" "+line.trim();}});
 return {meta:meta,body:match[2].trim()};
}
function renderBody(text){
 const blocks=text.replace(/\r/g,"").split(/\n\s*\n/).map(function(block){return block.trim();}).filter(Boolean);
 let firstTextBlock=true;
 return blocks.map(function(block){
  if(/^#{1,3}\s/.test(block)){const level=block.match(/^#+/)[0].length;return "<h"+level+">"+escapeHtml(block.replace(/^#{1,3}\s*/,""))+"</h"+level+">";}
  if(/^\d+\.\s/.test(block)){return "<h2>"+escapeHtml(block.replace(/\s+/g," "))+"</h2>";}
  if(/^निष्कर्ष\s*$/.test(block)){return "<h2>निष्कर्ष</h2>";}
  if(/^[-*]\s/m.test(block)){return "<ul>"+block.split("\n").map(function(line){return line.trim()?"<li>"+escapeHtml(line.replace(/^[-*]\s*/,""))+"</li>":"";}).join("")+"</ul>";}
  if(/^\d+\.\s/m.test(block)){return "<ol>"+block.split("\n").map(function(line){return line.trim()?"<li>"+escapeHtml(line.replace(/^\d+\.\s*/,""))+"</li>":"";}).join("")+"</ol>";}
  if(firstTextBlock){firstTextBlock=false;return "<h2>"+escapeHtml(block)+"</h2>";}
  return "<p>"+escapeHtml(block).replace(/\n/g,"<br>")+"</p>";
 }).join("\n");
}
(async function(){
 const filename=new URLSearchParams(location.search).get("post")||"";
 if(!/^[a-zA-Z0-9._-]+\.md$/.test(filename)){document.getElementById("status").textContent="यह लेख नहीं मिला।";return;}
 try{
  const postUrl=new URL("posts/"+encodeURIComponent(filename),document.baseURI);
  const controller=new AbortController();
  const timeout=setTimeout(function(){controller.abort();},10000);
  let response;
  try{response=await fetch(postUrl.href,{cache:"no-store",signal:controller.signal});}
  finally{clearTimeout(timeout);}
  if(!response.ok)throw new Error("HTTP "+response.status);
  const markdown=await response.text();
  const parsed=parseFrontMatter(markdown);if(!parsed||!parsed.meta.title)throw new Error("invalid post");
  document.title=parsed.meta.seo_title||parsed.meta.title+" | MARJAN.IN";
  document.querySelector('meta[name="description"]').content=parsed.meta.seo_description||parsed.meta.excerpt||"MARJAN.IN पर बच्चों की शिक्षा और परवरिश से जुड़े उपयोगी सुझाव।";
  document.getElementById("articleTitle").textContent=parsed.meta.title.trim();
  document.getElementById("articleMeta").textContent=[parsed.meta.category,parsed.meta.date].filter(Boolean).join(" • ");
  if(parsed.meta.image){const img=document.getElementById("articleImage");img.src=parsed.meta.image;img.alt=parsed.meta.title;img.hidden=false;img.onerror=function(){img.hidden=true;};}
  document.getElementById("articleBody").innerHTML=renderBody(parsed.body);
  document.getElementById("status").remove();
 }catch(error){const status=document.getElementById("status");status.textContent=error.name==="AbortError"?"लेख लोड होने में समय लग रहा है। कृपया फिर कोशिश करें।":"लेख अभी नहीं खुल सका ("+(error.message||"Network error")+"). Homepage पर वापस जाएँ और दोबारा खोलें।";}
})();
</script>
</body>
</html>
